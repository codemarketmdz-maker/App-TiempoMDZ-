name: Compilar APK TiempoMDZ

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'climamdz-android.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          test -f climamdz-android.zip
          mkdir -p proyecto
          unzip -q climamdz-android.zip -d proyecto
          test -f proyecto/settings.gradle.kts

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar Android SDK 34
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Preparar clave privada de firma
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tiempomdz-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/tiempomdz-release.keystore" >> "$GITHUB_ENV"

      - name: Compilar versión release firmada
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        working-directory: proyecto
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar APK release
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        run: |
          mkdir -p dist
          cp proyecto/app/build/outputs/apk/release/app-release.apk dist/TiempoMDZ.apk

      - name: Compilar APK instalable de prueba si no hay clave privada
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' || env.ANDROID_KEYSTORE_PASSWORD == '' || env.ANDROID_KEY_ALIAS == '' || env.ANDROID_KEY_PASSWORD == '' }}
        working-directory: proyecto
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar APK de prueba
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' || env.ANDROID_KEYSTORE_PASSWORD == '' || env.ANDROID_KEY_ALIAS == '' || env.ANDROID_KEY_PASSWORD == '' }}
        run: |
          mkdir -p dist
          cp proyecto/app/build/outputs/apk/debug/app-debug.apk dist/TiempoMDZ.apk

      - name: Verificar APK generado
        run: |
          test -s dist/TiempoMDZ.apk
          ls -lh dist/TiempoMDZ.apk
          file dist/TiempoMDZ.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TiempoMDZ-APK
          path: dist/TiempoMDZ.apk
          if-no-files-found: error

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tiempomdz-${{ github.run_number }}
          name: TiempoMDZ APK ${{ github.run_number }}
          files: dist/TiempoMDZ.apk
          fail_on_unmatched_files: true
